[project]
name = "datenspec"
version = "0.1.0"
description = "Data format spec for the Pico 2 W measurement platform (single source of truth: Pydantic models)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # 2.11 introduced validate_by_name / serialize_by_alias.
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datenspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 90
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "RUF", "UP", "PTH", "C4", "TRY", "SIM", "PLR2004", "PLE", "PLW", "FA", "DTZ", "PERF", "FURB", "PIE", "ISC", "RET", "NPY", "PD"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# Pydantic surfaces the ValueError message in ValidationError; that message is the point.
"src/datenspec/models/**" = ["TRY003"]
# Generator consistency errors: the message tells the developer what drifted.
"src/datenspec/codegen/**" = ["TRY003"]
